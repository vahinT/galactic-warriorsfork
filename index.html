<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zairyo Tensei - 1</title>

    <!-- Mammoth.js: DOCX → HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* Loading screen */
        #loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            color: #ccc;
            font-family: Arial, sans-serif;
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        #error {
            display: none;
            max-width: 700px;
            margin: 100px auto;
            padding: 30px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 12px;
            font-family: Arial, sans-serif;
        }

        #error h2 {
            color: #ff7777;
        }

        #error code {
            display: block;
            margin-top: 15px;
            padding: 15px;
            background: #0a0a0a;
            border-radius: 8px;
            overflow-x: auto;
        }

        /* Main reader */
        #reader {
            display: none;
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 35px 100px;
            line-height: 1.85;
        }

        /* Word → HTML output */
        #document {
            font-size: 19px;
        }

        #document p {
            margin: 0 0 1.2em;
            text-indent: 2em;
        }

        #document h1,
        #document h2,
        #document h3,
        #document h4 {
            text-align: center;
            text-indent: 0;
            color: #fff;
        }

        #document h1 {
            font-size: 42px;
            margin: 80px 0 40px;
        }

        #document h2 {
            font-size: 34px;
            margin: 80px 0 35px;
        }

        #document h3 {
            font-size: 27px;
            margin: 60px 0 30px;
        }

        #document h4 {
            font-size: 23px;
            margin: 50px 0 25px;
        }

        #document ul,
        #document ol {
            margin: 20px 0;
            padding-left: 2.5em;
        }

        #document li {
            margin-bottom: 8px;
        }

        #document blockquote {
            margin: 30px 20px;
            padding-left: 20px;
            border-left: 3px solid #555;
            color: #bbb;
            font-style: italic;
        }

        #document img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 30px auto;
        }

        #document a {
            color: #aaa;
        }

        /* Top bar */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 46px;
            background: rgba(17, 17, 17, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #292929;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        #topbar .title {
            color: #ddd;
        }

        #topbar .status {
            color: #777;
        }

        /* Mobile */
        @media (max-width: 600px) {
            #reader {
                padding: 55px 20px 70px;
            }

            #document {
                font-size: 17px;
                line-height: 1.75;
            }

            #document h1 {
                font-size: 34px;
            }

            #document h2 {
                font-size: 29px;
            }

            #document h3 {
                font-size: 24px;
            }

            #document p {
                text-indent: 1.5em;
            }

            #topbar .status {
                display: none;
            }
        }

        /* Print */
        @media print {
            #topbar,
            #loading,
            #error {
                display: none !important;
            }

            #reader {
                display: block !important;
                max-width: none;
                padding: 0;
            }

            body {
                background: white;
                color: black;
            }

            #document h1,
            #document h2,
            #document h3,
            #document h4 {
                color: black;
            }
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div class="title">Zairyo Tensei — 1</div>
        <div class="status" id="status">Loading manuscript...</div>
    </div>

    <div id="loading">
        <div class="loader"></div>
        <div>Loading Zairyo Tensei...</div>
    </div>

    <div id="error">
        <h2>Couldn't load the manuscript</h2>

        <p>
            The website couldn't download <b>Main.docx</b> from GitHub.
        </p>

        <p>
            Make sure the file is public and that it is located at:
        </p>

        <code>
            vahinT/ZT/Main.docx
        </code>

        <p>
            Then refresh the page.
        </p>
    </div>

    <main id="reader">
        <article id="document"></article>
    </main>

    <script>
        /*
         * Your Word document.
         *
         * This points directly at the raw GitHub file.
         */
        const DOCX_URL =
            "https://raw.githubusercontent.com/vahinT/galactic-warriorsfork/main/Main.docx";


        async function loadDocument() {

            const loading = document.getElementById("loading");
            const reader = document.getElementById("reader");
            const error = document.getElementById("error");
            const documentContainer = document.getElementById("document");
            const status = document.getElementById("status");

            try {

                /*
                 * The timestamp prevents the browser from displaying
                 * an old cached copy after you replace Main.docx.
                 */
                const url =
                    DOCX_URL +
                    "?v=" +
                    Date.now();

                status.textContent = "Downloading manuscript...";

                const response = await fetch(url, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        "GitHub returned HTTP " + response.status
                    );
                }

                status.textContent = "Converting manuscript...";

                const arrayBuffer = await response.arrayBuffer();

                /*
                 * Mammoth converts the Word document into HTML.
                 */
                const result = await mammoth.convertToHtml(
                    {
                        arrayBuffer: arrayBuffer
                    },
                    {
                        /*
                         * Preserve basic Word formatting.
                         */
                        styleMap: [
                            "p[style-name='Title'] => h1:fresh",
                            "p[style-name='Heading 1'] => h1:fresh",
                            "p[style-name='Heading 2'] => h2:fresh",
                            "p[style-name='Heading 3'] => h3:fresh",
                            "p[style-name='Heading 4'] => h4:fresh"
                        ]
                    }
                );

                documentContainer.innerHTML = result.value;

                /*
                 * Hide loading screen and show the book.
                 */
                loading.style.display = "none";
                reader.style.display = "block";

                status.textContent = "Manuscript loaded";

                /*
                 * If Mammoth encountered something it couldn't convert,
                 * log it to the browser console.
                 */
                if (result.messages && result.messages.length > 0) {
                    console.warn(
                        "Mammoth conversion messages:",
                        result.messages
                    );
                }

            } catch (err) {

                console.error("Failed to load DOCX:", err);

                loading.style.display = "none";
                reader.style.display = "none";
                error.style.display = "block";

                status.textContent = "Failed to load";
            }
        }


        /*
         * Start automatically.
         */
        loadDocument();
    </script>

</body>
</html>
